# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
name: Code Quality
on:
  push:
    branches: [main, master]
  pull_request:

# Estate guardrail: scope push to default branches so a PR fires once (not
# push+PR), and cancel superseded runs. Safe — read-only PR-triggered check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check file permissions
        run: |
          find . -type f -perm /111 -name "*.sh" | head -10 || true
      - name: ShellCheck (error severity)
        run: |
          # Error severity only: parse failures, unterminated find -exec, shebang
          # not on line 1. Warnings are deliberately not gated — a gate that fires
          # on style gets switched off, and these are the findings that break
          # scripts at runtime.
          #
          # Vendored/upstream trees are excluded: patching a third party's test
          # fixtures creates permanent divergence and conflicts on every sync.
          fail=0
          while IFS= read -r f; do
            case "/$f" in
              */node_modules/*|*/vendor/*|*/third_party/*|*/rescript-ecosystem/*) continue ;;
            esac
            shellcheck -S error "$f" || fail=1
          done < <(git ls-files '*.sh' '*.bash')
          if [ "$fail" -ne 0 ]; then
            echo "::error::shellcheck reported error-severity findings (see above)"
            exit 1
          fi
          echo "✅ shellcheck: no error-severity findings"

      - name: Check TODO/FIXME
        run: |
          echo "=== TODOs ==="
          grep -rn "TODO\|FIXME\|HACK\|XXX" --include="*.rs" --include="*.res" --include="*.py" --include="*.ex" . | head -20 || echo "None found"
      - name: Check for large files
        run: |
          find . -type f -size +1M -not -path "./.git/*" | head -10 || echo "No large files"
      - name: EditorConfig check
        uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393 # v3.0.0
        continue-on-error: true
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check documentation
        run: |
          MISSING=""
          [ ! -f "README.md" ] && [ ! -f "README.adoc" ] && MISSING="$MISSING README"
          [ ! -f "LICENSE" ] && [ ! -f "LICENSE.txt" ] && [ ! -f "LICENSE.md" ] && MISSING="$MISSING LICENSE"
          [ ! -f "CONTRIBUTING.md" ] && [ ! -f "CONTRIBUTING.adoc" ] && [ ! -f ".github/CONTRIBUTING.md" ] && [ ! -f ".github/CONTRIBUTING.adoc" ] && MISSING="$MISSING CONTRIBUTING"

          if [ -n "$MISSING" ]; then
            echo "::warning::Missing docs:$MISSING"
          else
            echo "✅ Core documentation present"
          fi
  agda:
    name: Agda proofs (PROOF-POLICY §2.1 canonical invocation)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      AGDA_VERSION: 2.7.0.1
      AGDA_SHA256: 975b515a14877ab6bce5bfc641e16c4a3ee52ca5d7f846577dee80aa2145db8a
      STDLIB_VERSION: "2.3"
      # Not yet recorded: the session that wrote this job could not reach the
      # archive host. The step below prints the observed digest and fails, so
      # the pin is set from a CI log, reviewed, and never skipped.
      STDLIB_SHA256: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned, digest-checked Agda and standard library
        run: |
          set -euo pipefail
          tc="$RUNNER_TEMP/agda"
          mkdir -p "$tc"
          curl --proto '=https' --proto-redir '=https' --fail --location --retry 3 -o "$tc/agda.tar.xz" \
            "https://github.com/agda/agda/releases/download/v$AGDA_VERSION/Agda-v$AGDA_VERSION-linux.tar.xz"
          echo "$AGDA_SHA256  $tc/agda.tar.xz" | sha256sum --check
          curl --proto '=https' --proto-redir '=https' --fail --location --retry 3 -o "$tc/stdlib.tar.gz" \
            "https://github.com/agda/agda-stdlib/archive/refs/tags/v$STDLIB_VERSION.tar.gz"
          observed=$(sha256sum "$tc/stdlib.tar.gz" | cut -d' ' -f1)
          if [ -z "$STDLIB_SHA256" ]; then
            echo "::error::agda-stdlib v$STDLIB_VERSION digest is not pinned; observed $observed"
            exit 1
          fi
          echo "$STDLIB_SHA256  $tc/stdlib.tar.gz" | sha256sum --check
          tar --no-same-owner -xJf "$tc/agda.tar.xz" -C "$tc"
          tar --no-same-owner -xzf "$tc/stdlib.tar.gz" -C "$tc"
          printf '%s\n' "$tc/agda-stdlib-$STDLIB_VERSION/standard-library.agda-lib" \
            "$GITHUB_WORKSPACE/verification/proofs/agda/ordinal-notation.agda-lib" > "$tc/libraries"
          mkdir -p "$HOME/.agda"
          cp "$tc/libraries" "$HOME/.agda/libraries"
          {
            echo "Agda_datadir=$tc/Agda-v$AGDA_VERSION/data"
            echo "LC_ALL=C.UTF-8"
          } >> "$GITHUB_ENV"
          echo "$tc/Agda-v$AGDA_VERSION/bin" >> "$GITHUB_PATH"
      - name: Manifest gate (gated modules compile, quarantined ones still fail)
        run: bash scripts/check-proofs.sh agda
      - name: Canonical invocation over the aggregator, with receipt
        working-directory: verification/proofs/agda
        run: |
          set -euo pipefail
          agda --version
          echo "commit: $GITHUB_SHA"
          echo "stdlib: agda-stdlib v$STDLIB_VERSION sha256 $STDLIB_SHA256"
          echo "flags: --safe --without-K --cubical-compatible"
          echo "first-party sources (All.agda imports the gated ones):"
          find . -name '*.agda' -print0 | sort -z | xargs -0 sha256sum
          find . -name '*.agdai' -delete
          agda --safe --without-K --cubical-compatible All.agda
