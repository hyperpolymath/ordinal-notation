# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
#
# Agda proof gate (PROOF-POLICY §2.1 canonical invocation), in its own workflow
# so that it is not held back by the other jobs. It moved here from
# quality.yml, whose runs have ended in startup_failure since 2026-11-09 with
# no job started; the cause is not visible from the run API.
name: Agda Proofs
on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agda:
    name: Agda proofs (PROOF-POLICY §2.1 canonical invocation)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      AGDA_VERSION: 2.7.0.1
      AGDA_SHA256: 975b515a14877ab6bce5bfc641e16c4a3ee52ca5d7f846577dee80aa2145db8a
      STDLIB_VERSION: "2.3"
      # Reproduced, not downloaded: the archive URL below answered 403 from the
      # session that set this pin, so the digest is of
      #   git archive --format=tar --prefix=agda-stdlib-2.3/ v2.3 | gzip -cn
      # run on a clone of agda/agda-stdlib tag v2.3 (commit
      # 8326c7475af1fa456ca04a0203c168d5d7ff842b, git 2.43.0). The step below
      # checks it against the real download and prints the observed digest on
      # a mismatch, so a wrong pin fails loudly and is corrected from the log.
      STDLIB_SHA256: 407286af16f2b5b8aebe577b3610ae9b40ce296ed3c03c66444b5801c2fa3012
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned, digest-checked Agda and standard library
        run: |
          set -euo pipefail
          tc="$RUNNER_TEMP/agda"
          mkdir -p "$tc"
          curl --proto '=https' --proto-redir '=https' --fail --location --retry 3 -o "$tc/agda.tar.xz" \
            "https://github.com/agda/agda/releases/download/v$AGDA_VERSION/Agda-v$AGDA_VERSION-linux.tar.xz"
          echo "$AGDA_SHA256  $tc/agda.tar.xz" | sha256sum --check
          curl --proto '=https' --proto-redir '=https' --fail --location --retry 3 -o "$tc/stdlib.tar.gz" \
            "https://github.com/agda/agda-stdlib/archive/refs/tags/v$STDLIB_VERSION.tar.gz"
          observed=$(sha256sum "$tc/stdlib.tar.gz" | cut -d' ' -f1)
          if [ -z "$STDLIB_SHA256" ]; then
            echo "::error::agda-stdlib v$STDLIB_VERSION digest is not pinned; observed $observed"
            exit 1
          fi
          if [ "$observed" != "$STDLIB_SHA256" ]; then
            echo "::error::agda-stdlib v$STDLIB_VERSION digest mismatch; pinned $STDLIB_SHA256, observed $observed"
            exit 1
          fi
          echo "$STDLIB_SHA256  $tc/stdlib.tar.gz" | sha256sum --check
          tar --no-same-owner -xJf "$tc/agda.tar.xz" -C "$tc"
          tar --no-same-owner -xzf "$tc/stdlib.tar.gz" -C "$tc"
          printf '%s\n' "$tc/agda-stdlib-$STDLIB_VERSION/standard-library.agda-lib" \
            "$GITHUB_WORKSPACE/verification/proofs/agda/ordinal-notation.agda-lib" > "$tc/libraries"
          mkdir -p "$HOME/.agda"
          cp "$tc/libraries" "$HOME/.agda/libraries"
          {
            echo "Agda_datadir=$tc/Agda-v$AGDA_VERSION/data"
            echo "LC_ALL=C.UTF-8"
          } >> "$GITHUB_ENV"
          echo "$tc/Agda-v$AGDA_VERSION/bin" >> "$GITHUB_PATH"
      - name: Manifest gate (gated modules compile, quarantined ones still fail)
        run: bash scripts/check-proofs.sh agda
      - name: Canonical invocation over the aggregator, with receipt
        working-directory: verification/proofs/agda
        run: |
          set -euo pipefail
          agda --version
          echo "commit: $GITHUB_SHA"
          echo "stdlib: agda-stdlib v$STDLIB_VERSION sha256 $STDLIB_SHA256"
          echo "flags: --safe --without-K --cubical-compatible --double-check -W error -W noUnsupportedIndexedMatch"
          echo "first-party sources (All.agda imports the gated ones):"
          find . -name '*.agda' -print0 | sort -z | xargs -0 sha256sum
          find . -name '*.agdai' -delete
          agda --safe --without-K --cubical-compatible --double-check -W error -W noUnsupportedIndexedMatch All.agda
