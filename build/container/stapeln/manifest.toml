# SPDX-License-Identifier: MPL-2.0
#
# Cerro Torre manifest for ordinal-notation .ctp bundle
#
# This manifest describes the container image for verified
# container packaging. Used by `ct pack` to create .ctp bundles.

[metadata]
name = "ordinal-notation"
version = "0.1.0"
revision = 1
summary = "Constructive Agda development of ordinal notations, extracted from echo-types: Brouwer ordinals, the Veblen hierarchy up to a defined Γ₀, and a Buchholz-style term order with machine-checked well-foundedness under --safe --without-K. Frozen hand-off record; order-type fidelity to ψ₀(Ω_ω) is open."
description = """
ordinal-notation — containerised service packaged as a verified
cerro-torre .ctp bundle with Ed25519 signing and full provenance
tracking.
"""
license = "MPL-2.0"
homepage = "https://github.com/hyperpolymath/ordinal-notation"
maintainer = "Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"

[provenance]
upstream = "https://github.com/hyperpolymath/ordinal-notation"
import_date = 2026-10-26T00:00:00Z

[dependencies]
runtime = ["ca-certificates", "curl"]
build = []

[build]
system = "podman"

[build.environment]
APP_HOST = "[::]"
APP_PORT = "8080"

[outputs]
primary = "ordinal-notation"
split = []

[attestations]
require = ["source-signature", "sbom-complete"]
recommend = ["security-audit", "reproducible-build"]

# Runtime security profile
[security]
user = "appuser"
group = "appuser"
read_only_root = false
no_new_privileges = true

[security.capabilities]
drop = ["ALL"]
add = ["NET_BIND_SERVICE"]

[security.network]
listen_tcp = [8080]

[security.filesystem]
read = ["/app/", "/data/"]
write = ["/data/", "/tmp/"]
execute = ["/app/entrypoint.sh"]
